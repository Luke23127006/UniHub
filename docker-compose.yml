version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: unihub_postgres
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - unihub_pg_data:/var/lib/postgresql/data
    networks:
      - unihub_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: unihub_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@unihub.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - unihub_network

  redis:
    image: redis:7-alpine
    container_name: unihub_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - unihub_redis_data:/data
    networks:
      - unihub_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: unihub_redis_commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - unihub_network

volumes:
  unihub_pg_data:
  unihub_redis_data:

networks:
  unihub_network:
    driver: bridge